<title>Recall</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recall">
<meta name="theme-color" content="#E8ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#E8ECF1;--surface:#FFFFFF;--ink:#141C28;--muted:#586376;--line:#D3D9E2;--accent:#2148D4;--accent-ink:#FFFFFF;--card:#FFFFFD;--rule:#E0505B;--bad:#C2343F;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0D1218;--surface:#161D27;--ink:#E6EBF2;--muted:#97A2B4;--line:#2A3443;--accent:#88A3FF;--accent-ink:#0A1022;--card:#19212D;--rule:#E8646D;--bad:#F27E86;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 24px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
form::before{content:"";position:absolute;left:0;right:0;top:66px;height:2px;background:var(--rule)}
h1{margin:0 0 34px;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;height:30px}
.mark{width:30px;height:22px;border-radius:4px;border:1.5px solid var(--ink);transform:rotate(-6deg);position:relative}
.mark::before{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:var(--rule)}
label{display:block;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px}
input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:1.05rem}
input:focus{outline:3px solid var(--accent);outline-offset:1px}
button{margin-top:20px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-weight:700;min-height:1.5em;margin:12px 0 0}
.note{color:var(--muted);font-size:.85rem;margin:6px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<form id="f" hidden autocomplete="on">
  <h1><span class="mark" aria-hidden="true"></span>Recall</h1>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b">Log in</button>
  <p class="err" id="e" role="alert"></p>
  <p class="note">You stay logged in on this device, so Recall also opens offline.</p>
</form>

const f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>{let s='';new Uint8Array(a).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const enc=new TextEncoder();
if(!window.crypto||!crypto.subtle){f.hidden=false;e.textContent='Open Recall from its https:// address in Safari.';b.disabled=true;return}
async function aesKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt','encrypt'])}
async function kidOf(raw){const k=await aesKey(raw);return bu(await crypto.subtle.encrypt({name:'AES-GCM',iv:new Uint8Array(12)},k,enc.encode('recall'))).slice(0,16)}
async function openApp(raw){

  document.open();document.write(html);document.close();
}
// Remembered on this device?
try{const saved=localStorage.getItem(KEY);

async function unwrap(user,pw){
  for(const x of D.users){
    const base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:ub(x.s),iterations:D.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);

}
